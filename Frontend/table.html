<!DOCTYPE html>
<html lang="en">

<head>
    <title>Tables</title> 
    
    <style>
        table{
            border-collapse:collapse;
            background-color: rgb(195, 214, 230);
            margin: auto;
            width: 70%;
            border-color: black;
        }
        th, td{
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th{
            background-color: rgb(236, 148, 148);
        }

    </style>
</head>
        <body>
            <table>

                <tr>
                    <th>Head1</th>
                    <th>Head2</th>
                    <th>Head3</th>
                    <th>Head4</th>
                </tr>
                <tr>
                    <td >Row 1,Cell 1</td>
                    <td > Row 1, Cell 2</td>
                    <td > Row 1, Cell 3</td>
                    <td > Row 1, Cell 4</td>
                </tr>

                <tr>
                    <td >Row 2,Cell 1</td>
                    <td > Row 2, Cell 2</td>
                    <td > Row 2, Cell 3</td>
                    <td > Row 2, Cell 4</td>
                </tr>

                <tr>
                    <td >Row 3,Cell 1</td>
                    <td > Row 3, Cell 2</td>
                    <td > Row 3, Cell 3</td>
                    <td > Row 3, Cell 4</td>
                </tr>

            </table>

        </body>



</html>
