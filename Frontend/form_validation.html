<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Forms 2</title>
    </head>

    <body> 
        <form action="action.php" method="post">
            <fieldset style="width: 600px; height: 600px;">


                <legend style="color: blue;">Registration Form</legend>
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required minlength="3"
                 maxlength="50" placeholder="Enter Your Full Name">

                 <br>
                 <br>

                 <label for="email">Email:</label>
                 <input type="email" id="email" name="email" required
                 placeholder="Enter Your Email" autocomplete="email">

                 <br>
                 <br>

                 <label for="phone">Phone No:</label>
                 <input type="tel" id="phone" name="phone" required minlength="10" 
                 placeholder="Enter 10 digit mobile no">

                 <br>
                 <br>

                 


            </fieldset>

        </form>


        

    </body>

</html>
