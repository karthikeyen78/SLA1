<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Cointainer</title>
    <style>
        .box1{background-color: rgb(33, 166, 243);}
        .box2{background-color: rgb(19, 216, 52);}
        .box3{background-color: rgb(17, 86, 204);}
        .box4{background-color: rgb(229, 248, 15);}
        .box5{background-color: rgb(209, 23, 29);}
        .box6{background-color: rgb(212, 33, 228);}

        .box{
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-size: 35px;
            padding: 15px;
            margin:10px;
        }

        .container{
            display: flex;
            flex-direction: row;
            justify-content: center;
        }

    </style>
</head>
<body>
    <div class="container">

        <div class="box box1">One</div>
        <div class="box box2">Two</div>
        <div class="box box3">Three</div>
        <div class="box box4">Four</div>
        <div class="box box5">Five</div>
        <div class="box box6">Six</div>



    </div>
</body>
</html>
