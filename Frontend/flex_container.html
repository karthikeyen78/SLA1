<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Cointainer</title>
    <style>
        .box1{background-color: rgb(126, 171, 197);}
        .box2{background-color: rgb(28, 169, 185);}
        .box3{background-color: rgb(86, 189, 68);}
        .box4{background-color: rgb(89, 80, 218);}
        .box5{background-color: rgb(206, 74, 146);}
        .box6{background-color: rgb(202, 137, 208);}

        .box{
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-size: 35px;
            border-radius: 5px;
            padding: 15px;
            margin:10px;
            border: 2px dotted black;
        
        }
        .container{
            display: flex;
            flex-direction: row;
            justify-content: center;
            border: 2px;
            border-style:solid ;
        }

    </style>
</head>
<body>
    <h1>FLEX Container </h1>
    <div class="container">

        <div class="box box1">One</div>
        <div class="box box2">Two</div>
        <div class="box box3">Three</div>
        <div class="box box4">Four</div>
        <div class="box box5">Five</div>
        <div class="box box6">Six</div>



    </div>
</body>
</html>
