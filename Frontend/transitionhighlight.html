<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a{
            box-shadow: 0 0 0 0 rgb(11, 209, 209) inset ;
            color: aqua;
            padding: 0;
            margin: 0;
            transition: color .3s ease-in-out, box-shadow .3s ease-in-out;
        }

        a:hover{
            color: rgb(0, 0, 0);
            box-shadow: 200px 0 0 0 #546deb inset;
        }

        a{
            color: aquamarine;
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            font-weight: 700;
            line-height: 1.5;
            text-decoration: none;
        }


    </style>
</head>
<body>
    <a href="#">Hover this link</a>
</body>
</html>
