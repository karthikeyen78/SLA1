<!DOCTYPE html>
<html lang="en">

<head>
    <title> Form Elements</title>
</head>
        <body>
                <fieldset style="width: 700px; height: 600px;">
                    <legend style="font-size: 30px; color: blue;">Fill the Form </legend>
                    <legend>

                        <label for="card">Choose a Car:</label>

                        <select name="cars" id="cars">

                            <optgroup label="Swedish Cars" disabled>
                                <option value="Volvo">Volvo</option>
                                <option value="Saab">Saab</option>
                            </optgroup>

                            <optgroup label="German Cars">
                                <option value="Audi">Audi</option>
                                <option value="BMW">BMW</option>
                            </optgroup>

                        </select>
                        <br>
                        <br>

                        <textarea name="message" rows="10" cols="50">Cat was Playing in the street</textarea>


                    </legend>
                </fieldset>
        </body>



</html>
